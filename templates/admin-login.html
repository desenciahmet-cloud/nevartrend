{% extends base.html %}

{% block title %}Yönetici Girişi | nevartrend{% endblock %}

{% block content %}
<div class=min-h-[70vh] flex items-center justify-center px-4 py-12>
  <div class=max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 space-y-6>
    <div class=text-center space-y-2>
      <div class=w-16 h-16 bg-emerald-700 text-white rounded-2xl mx-auto flex items-center justify-center font-bold text-2xl shadow-lg border border-emerald-500/40>
        N
      </div>
      <h2 class=font-serif-title text-2xl font-extrabold text-slate-900>Yönetici Girişi</h2>
      <p class=text-xs text-slate-500>nevartrend Mağaza ve Sipariş Yönetim Paneli</p>
    </div>

    {% if error %}
    <div class=p-3.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-bold flex items-center gap-2>
      <i data-lucide=alert-circle class=w-4 h-4 text-rose-600></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action=/admin/login method=POST class=space-y-4 text-xs>
      <div>
        <label class=block font-bold text-slate-700 mb-1.5>Kullanıcı Adı</label>
        <div class=relative>
          <i data-lucide=user class=w-4 h-4 text-slate-400 absolute left-3.5 top-3.5></i>
          <input type=text name=username required placeholder=admin class=w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none>
        </div>
      </div>

      <div>
        <label class=block font-bold text-slate-700 mb-1.5>Yönetici Şifresi</label>
        <div class=relative>
          <i data-lucide=lock class=w-4 h-4 text-slate-400 absolute left-3.5 top-3.5></i>
          <input type=password name=password required placeholder=•••••••• class=w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-emerald-600 focus:outline-none>
        </div>
      </div>

      <button type=submit class=w-full py-3.5 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2>
        <i data-lucide=log-in class=w-4 h-4></i>
        <span>Güvenli Giriş Yap</span>
      </button>
    </form>

    <div class=pt-4 border-t border-slate-100 text-center>
      <a href=/ class=text-xs text-slate-400 hover:text-emerald-700 font-semibold transition flex items-center justify-center gap-1>
        <i data-lucide=arrow-left class=w-3.5 h-3.5></i>
        <span>Mağazaya Geri Dön</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
